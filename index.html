<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selvin Rojas - Portfolio</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            background-color: #1f2937;
            color: #fff;
            width: 100%;
            padding: 3rem 0;
            text-align: center;
        }
        header h1 {
            margin: 0;
            font-size: 2.5rem;
        }
        header p {
            margin-top: 0.5rem;
            font-size: 1.1rem;
            color: #9ca3af;
        }
        .container {
            max-width: 800px;
            width: 90%;
            margin: -2rem auto 2rem auto;
            background: #fff;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            color: #1f2937;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .project-list {
            list-style-type: none;
            padding: 0;
        }
        .project-item {
            background: #f9fafb;
            margin: 1.5rem 0;
            padding: 1.5rem;
            border-radius: 8px;
            border-left: 5px solid #2563eb;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .project-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }
        .project-item a {
            text-decoration: none;
            color: #1d4ed8;
            font-size: 1.3rem;
            font-weight: bold;
        }
        .project-item a:hover {
            text-decoration: underline;
        }
        .project-description {
            margin-top: 0.5rem;
            color: #4b5563;
        }
    </style>
</head>
<body>

    <header>
        <h1>Selvin Rojas</h1>
