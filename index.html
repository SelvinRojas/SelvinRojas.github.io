<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SELVIN_ROJAS // SYSTEM_ARCHITECT</title>
    <style>
        :root {
            --bg: #030305;
            --surface: rgba(12, 12, 18, 0.85);
            --accent: #00f3ff;
            --accent-dim: rgba(0, 243, 255, 0.1);
            --text-main: #f0f0f0;
            --text-dim: #707080;
            --border: rgba(255, 255, 255, 0.08);
            --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 10% 10%, #0d1a21 0%, transparent 30%),
                radial-gradient(circle at 90% 90%, #110d16 0%, transparent 30%);
            color: var(--text-main);
            font-family: var(--font-mono);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* --- SLEEK DATA TOP BAR --- */
        .top-nav {
            backdrop-filter: blur(15px);
            background: rgba(0, 0, 0, 0.7);
            border-bottom: 1px solid var(--border);
            padding: 15px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .sys-status {
            font-size: 10px;
            color: var(--accent);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* --- LAYOUT --- */
        .mainframe {
            max-width: 1300px;
            margin: 60px auto;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 40px;
            padding: 0 30px;
        }

        /* --- BIOMETRIC ID SIDEBAR --- */
        .sidebar {
            position: sticky;
            top: 120px;
            height: fit-content;
        }

        .bio-module {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 30px;
            position: relative;
        }

        .bio-module::before {
            content: "";
            position: absolute;
            top: -1px; left: -1px; width: 30px; height: 30px;
            border-top: 2px solid var(--accent);
            border-left: 2px solid var(--accent);
        }

        .profile-container {
            width: 100%;
            aspect-ratio: 1;
            background: #000;
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .profile-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) contrast(1.1);
            transition: 0.5s;
        }

        .profile-container:hover img {
            filter: grayscale(0%);
        }

        .biometric-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: 1px solid rgba(0, 243, 255, 0.2);
            pointer-events: none;
            background: linear-gradient(0deg, rgba(0,243,255,0.05) 0%, transparent 100%);
        }

        .scan-line {
            width: 100%;
            height: 2px;
            background: var(--accent);
            position: absolute;
            top: 0;
            box-shadow: 0 0 15px var(--accent);
            animation: scan 3s ease-in-out infinite;
        }

        @keyframes scan {
            0%, 100% { top: 0%; }
            50% { top: 100%; }
